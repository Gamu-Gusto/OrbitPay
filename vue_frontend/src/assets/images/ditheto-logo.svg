<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized D Symbol -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer D curve (gold) -->
  <path d="M10 10 Q40 10 40 30 Q40 50 10 50 Z" fill="url(#goldGradient)" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Inner D stroke (black) -->
  <path d="M15 15 L15 45 L35 45 Q35 35 35 30 Q35 25 35 15 Z" fill="url(#blackGradient)"/>
  
  <!-- Black rectangular bar -->
  <rect x="50" y="15" width="140" height="30" fill="#000000"/>
  
  <!-- Ditheto text on the bar -->
  <text x="70" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="start" dominant-baseline="middle">Ditheto</text>
  <text x="170" y="35" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="end" dominant-baseline="middle">Accountants</text>
</svg>
